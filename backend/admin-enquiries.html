<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Enquiries Admin | Shubham Dev Studio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#6366f1",
            },
          },
        },
      };
    </script>

    <!-- React + ReactDOM + Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const App = () => {
        const [enquiries, setEnquiries] = useState([]);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");
        const [search, setSearch] = useState("");

        // ----------------------
        // Fetch all enquiries
        // ----------------------
        const fetchEnquiries = async () => {
          setLoading(true);
          setError("");
          try {
            const res = await fetch(
              "http://localhost/shubhamdevstudio-api/list_enquiries.php"
            );
            const data = await res.json();
            if (!res.ok || !data.success) {
              throw new Error(data.message || "Failed to load enquiries");
            }
            setEnquiries(data.data || []);
          } catch (err) {
            console.error(err);
            setError(err.message || "Server error");
          } finally {
            setLoading(false);
          }
        };

        useEffect(() => {
          fetchEnquiries();
        }, []);

        // ----------------------
        // Delete enquiry
        // ----------------------
        const deleteEntry = async (id) => {
          if (!confirm("Are you sure you want to delete this enquiry?")) return;

          try {
            const res = await fetch(
              "http://localhost/shubhamdevstudio-api/delete_enquiry.php",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id }),
              }
            );

            const data = await res.json();

            if (!data.success) {
              throw new Error(data.message || "Delete failed");
            }

            alert("Deleted successfully!");
            fetchEnquiries(); // refresh table
          } catch (err) {
            console.error(err);
            alert("Server error while deleting");
          }
        };

        // ----------------------
        // Update status (done/pending)
        // ----------------------
        const updateStatus = async (id, status) => {
          try {
            const res = await fetch(
              "http://localhost/shubhamdevstudio-api/update_status.php",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id, status }),
              }
            );

            const data = await res.json();

            if (!data.success) {
              throw new Error(data.message || "Update failed");
            }

            alert("Status updated!");
            fetchEnquiries();
          } catch (err) {
            console.error(err);
            alert("Server error while updating status");
          }
        };

        // simple search filter
        const filtered = enquiries.filter((e) => {
          const text =
            (e.name || "") +
            " " +
            (e.contact || "") +
            " " +
            (e.need || "") +
            " " +
            (e.message || "");
          return text.toLowerCase().includes(search.toLowerCase());
        });

        return (
          <div className="max-w-6xl mx-auto px-4 py-6">
            <header className="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-6">
              <div>
                <h1 className="text-2xl font-semibold">
                  Enquiries – Admin View
                </h1>
                <p className="text-sm text-slate-400">
                  Data coming from MySQL table <code>enquiries</code> via
                  XAMPP/PHP API.
                </p>
              </div>
              <div className="flex gap-2">
                <input
                  type="text"
                  placeholder="Search by name, contact, need..."
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  className="rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm outline-none focus:border-primary focus:ring-1 focus:ring-primary"
                />
                <button
                  onClick={fetchEnquiries}
                  className="px-4 py-2 rounded-lg bg-primary text-sm font-medium hover:bg-indigo-700"
                >
                  Refresh
                </button>
              </div>
            </header>

            {loading && (
              <p className="text-sm text-slate-300 mb-3">Loading enquiries…</p>
            )}
            {error && (
              <p className="text-sm text-red-400 mb-3">Error: {error}</p>
            )}

            <div className="overflow-x-auto rounded-xl border border-slate-800 bg-slate-900">
              <table className="min-w-full text-sm">
                <thead className="bg-slate-800/70">
                  <tr>
                    <th className="px-3 py-2 text-left">ID</th>
                    <th className="px-3 py-2 text-left">Name</th>
                    <th className="px-3 py-2 text-left">Contact</th>
                    <th className="px-3 py-2 text-left">Need</th>
                    <th className="px-3 py-2 text-left">Message</th>
                    <th className="px-3 py-2 text-left">Status</th>
                    <th className="px-3 py-2 text-left">Created at</th>
                    <th className="px-3 py-2 text-left">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.length === 0 && !loading ? (
                    <tr>
                      <td
                        colSpan="8"
                        className="px-3 py-4 text-center text-slate-400"
                      >
                        No enquiries found.
                      </td>
                    </tr>
                  ) : (
                    filtered.map((row) => {
                      const status = row.status || "pending";
                      return (
                        <tr
                          key={row.id}
                          className="border-t border-slate-800 hover:bg-slate-800/60"
                        >
                          <td className="px-3 py-2 text-slate-400">
                            {row.id}
                          </td>
                          <td className="px-3 py-2">{row.name}</td>
                          <td className="px-3 py-2 text-slate-300">
                            {row.contact}
                          </td>
                          <td className="px-3 py-2 text-slate-200">
                            {row.need}
                          </td>
                          <td className="px-3 py-2 max-w-xs break-words text-slate-300">
                            {row.message}
                          </td>

                          {/* Status badge */}
                          <td className="px-3 py-2">
                            <span
                              className={
                                "px-2 py-1 rounded text-xs " +
                                (status === "done"
                                  ? "bg-emerald-600 text-white"
                                  : "bg-yellow-500 text-black")
                              }
                            >
                              {status}
                            </span>
                          </td>

                          <td className="px-3 py-2 text-slate-400 text-xs">
                            {row.created_at}
                          </td>

                          {/* Action buttons */}
                          <td className="px-3 py-2">
                            <div className="flex flex-wrap gap-2">
                              <button
                                onClick={() => updateStatus(row.id, "done")}
                                className="px-3 py-1 rounded bg-emerald-500 text-xs text-white hover:bg-emerald-600"
                              >
                                Done
                              </button>
                              <button
                                onClick={() => updateStatus(row.id, "pending")}
                                className="px-3 py-1 rounded bg-slate-600 text-xs text-white hover:bg-slate-500"
                              >
                                Mark pending
                              </button>
                              <button
                                onClick={() => deleteEntry(row.id)}
                                className="px-3 py-1 rounded bg-red-500 text-xs text-white hover:bg-red-600"
                              >
                                Delete
                              </button>
                            </div>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
